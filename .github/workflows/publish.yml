name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test dependencies
        run: python -m pip install ".[dev,plot]"
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build and verify distributions
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install build tools
        run: python -m pip install build twine
      - name: Validate release tag and main-branch ancestry
        if: github.event_name == 'release'
        run: python scripts/check_release.py --tag "$RELEASE_TAG" --require-main-ancestor
      - name: Build source distribution and wheel
        run: python -m build
      - name: Check distribution contents and metadata
        run: |
          python scripts/check_release.py --artifacts dist
          python -m twine check --strict dist/*
      - name: Test installed wheel from the source archive
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/cwt3d-wheel"
          wheel=$(python -c 'from pathlib import Path; print(next(Path("dist").glob("*.whl")).resolve())')
          "$RUNNER_TEMP/cwt3d-wheel/bin/python" -m pip install "${wheel}[dev,plot]"
          python - <<'PY'
          import os
          from pathlib import Path
          import tarfile
          target = Path(os.environ['RUNNER_TEMP']) / 'cwt3d-source'
          target.mkdir()
          with tarfile.open(next(Path('dist').glob('*.tar.gz'))) as archive:
              archive.extractall(target, filter='data')
          PY
          source=$(python -c 'import os; from pathlib import Path; print(next((Path(os.environ["RUNNER_TEMP"])/"cwt3d-source").iterdir()))')
          cd "$source"
          "$RUNNER_TEMP/cwt3d-wheel/bin/python" -I -m pytest -q
          "$RUNNER_TEMP/cwt3d-wheel/bin/python" -I examples/liang_70um.py --N 4 --D 1 --q 8 --output "$RUNNER_TEMP/cwt3d-smoke"
      - name: Save verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Upload to PyPI
    needs: build
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/cwt3d
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          skip-existing: false
          attestations: true
          print-hash: true
