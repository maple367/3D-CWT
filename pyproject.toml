[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cwt3d"
version = "0.1.0"
description = "Independent numerical core for three-dimensional coupled-wave theory"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7"]
plot = ["matplotlib>=3.6"]
numba = ["numba>=0.61"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cwt3d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
